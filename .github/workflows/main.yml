name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Essential Tools
        # Hum sirf pip ka use karenge, apt-get ko bypass kar rahe hain
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer setuptools

      - name: Build with Buildozer
        # Buildozer khud zaroori dependencies download karega
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # --profile se buildozer ko batayenge ki ye ek fresh build hai
          yes | buildozer -v android debug
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vajra-System-Update
          path: bin/*.apk
          
