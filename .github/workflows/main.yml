name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Node.js 24 compatibility for 2026
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Cache hata diya hai taki requirements.txt ka error na aaye

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Build Tools
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 setuptools
          pip install buildozer

      - name: Build with Buildozer
        run: |
          # Buildozer binary ko path mein add karna
          export PATH=$PATH:$HOME/.local/bin
          # License automatically accept karke build shuru karna
          yes | buildozer -v android debug
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vajra-System-Update
          path: bin/*.apk
          if-no-files-found: warn
